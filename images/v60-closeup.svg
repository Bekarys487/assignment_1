<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Cone-shaped dripper lined with a paper filter and coffee grounds</title>
  <rect width="800" height="500" fill="#f7efe3"/>
  <rect x="0" y="450" width="800" height="50" fill="#eadfc9"/>
  <!-- dripper base ring -->
  <rect x="320" y="408" width="160" height="26" rx="8" fill="#8a4523"/>
  <!-- outer cone -->
  <path d="M 130 110 L 670 110 L 480 412 L 320 412 Z" fill="#b25b34"/>
  <!-- spiral ribs -->
  <g fill="none" stroke="#8a4523" stroke-width="5" stroke-linecap="round" opacity="0.85">
    <path d="M 190 170 Q 400 215 610 170"/>
    <path d="M 225 230 Q 400 270 575 230"/>
    <path d="M 262 290 Q 400 325 538 290"/>
    <path d="M 300 350 Q 400 378 500 350"/>
  </g>
  <!-- inside opening -->
  <ellipse cx="400" cy="110" rx="270" ry="34" fill="#3b2a20"/>
  <!-- paper filter, folded edge sticking out -->
  <path d="M 150 108 Q 400 60 650 108 Q 400 140 150 108 Z" fill="#fffaf0" stroke="#eadfc9" stroke-width="3"/>
  <!-- grounds -->
  <ellipse cx="400" cy="112" rx="220" ry="20" fill="#4a3324"/>
  <ellipse cx="400" cy="108" rx="170" ry="11" fill="#6b4a33"/>
  <g fill="#3b2a20">
    <circle cx="330" cy="110" r="3"/><circle cx="380" cy="114" r="3"/><circle cx="430" cy="107" r="3"/>
    <circle cx="470" cy="113" r="3"/><circle cx="355" cy="104" r="2.5"/><circle cx="500" cy="106" r="2.5"/>
  </g>
  <!-- steam -->
  <g fill="none" stroke="#7a8b5c" stroke-width="4" stroke-linecap="round" opacity="0.8">
    <path d="M 340 70 q -12 -16 0 -28 q 12 -12 0 -24"/>
    <path d="M 400 66 q -12 -16 0 -28 q 12 -12 0 -24"/>
    <path d="M 460 70 q -12 -16 0 -28 q 12 -12 0 -24"/>
  </g>
</svg>
