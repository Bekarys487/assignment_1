<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Gooseneck kettle pouring water over a cone dripper on a mug</title>
  <rect width="800" height="500" fill="#f7efe3"/>
  <!-- table -->
  <rect x="0" y="440" width="800" height="60" fill="#eadfc9"/>
  <!-- mug -->
  <path d="M 330 340 L 330 410 Q 330 440 360 440 L 440 440 Q 470 440 470 410 L 470 340 Z" fill="#b25b34"/>
  <path d="M 470 358 Q 512 358 512 390 Q 512 420 466 420" fill="none" stroke="#b25b34" stroke-width="14" stroke-linecap="round"/>
  <ellipse cx="400" cy="340" rx="70" ry="9" fill="#3b2a20"/>
  <!-- dripper -->
  <rect x="352" y="322" width="96" height="14" rx="4" fill="#8a4523"/>
  <path d="M 262 226 L 538 226 L 446 322 L 354 322 Z" fill="#b25b34"/>
  <path d="M 285 226 L 515 226 L 436 310 L 364 310 Z" fill="#f7efe3" opacity="0.9"/>
  <ellipse cx="400" cy="226" rx="138" ry="13" fill="#4a3324"/>
  <ellipse cx="400" cy="224" rx="112" ry="8" fill="#6b4a33"/>
