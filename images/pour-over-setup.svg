  <!-- kettle -->
  <path d="M 70 130 Q 70 108 92 108 L 198 108 Q 220 108 220 130 L 220 196 Q 220 216 200 216 L 90 216 Q 70 216 70 196 Z" fill="#3b2a20"/>
  <path d="M 70 132 Q 30 132 30 168 Q 30 200 70 200" fill="none" stroke="#3b2a20" stroke-width="12" stroke-linecap="round"/>
  <rect x="120" y="94" width="50" height="14" rx="5" fill="#3b2a20"/>
  <circle cx="145" cy="86" r="8" fill="#7a8b5c"/>
  <path d="M 214 190 C 270 190, 300 150, 344 172" fill="none" stroke="#3b2a20" stroke-width="12" stroke-linecap="round"/>
  <!-- steam -->
  <g fill="none" stroke="#7a8b5c" stroke-width="4" stroke-linecap="round" opacity="0.8">
    <path d="M 118 66 q -12 -16 0 -30 q 12 -14 0 -28"/>
    <path d="M 172 66 q -12 -16 0 -30 q 12 -14 0 -28"/>
